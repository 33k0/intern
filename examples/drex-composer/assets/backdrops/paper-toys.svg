<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#fdf6e3"/><stop offset="0.55" stop-color="#ff6b6b"/><stop offset="1" stop-color="#fdf6e3"/></linearGradient>
    <radialGradient id="g1" cx="0.72" cy="0.3" r="0.6"><stop offset="0" stop-color="#4dabf7" stop-opacity="0.85"/><stop offset="1" stop-color="#4dabf7" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.2" cy="0.78" r="0.5"><stop offset="0" stop-color="#ffd43b" stop-opacity="0.5"/><stop offset="1" stop-color="#ffd43b" stop-opacity="0"/></radialGradient>
    <filter id="flow" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.066" numOctaves="3" seed="50" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="260" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="53"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.09 0"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <g filter="url(#flow)">
    <rect width="1920" height="1080" fill="url(#g1)"/>
    <rect width="1920" height="1080" fill="url(#g2)"/>
    <ellipse cx="1180" cy="620" rx="520" ry="150" fill="#4dabf7" opacity="0.28"/>
    <ellipse cx="520" cy="300" rx="380" ry="110" fill="#ffd43b" opacity="0.16"/>
  </g>
  <rect width="1920" height="1080" filter="url(#grain)"/>
</svg>
